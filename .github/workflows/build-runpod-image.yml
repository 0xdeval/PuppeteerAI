name: Build & Push RunPod Image

on:
  workflow_dispatch:  # manual trigger only — run when you want to publish a new image

jobs:
  build:
    runs-on: ubuntu-latest  # native linux/amd64, no emulation needed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:latest
          # Cache layers between runs so model download is only paid once
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:buildcache,mode=max
