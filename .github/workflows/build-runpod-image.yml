name: Build & Push RunPod Image

on:
  workflow_dispatch:  # manual trigger only — run when you want to publish a new image

jobs:
  build:
    runs-on: ubuntu-latest  # native linux/amd64, no emulation needed

    steps:
      - name: Free disk space
        # qwen2.5vl:32b is ~20GB. CUDA base ~6GB. Need 30GB+ free on the runner.
        run: |
          echo "Disk before cleanup:"
          df -h /
          # Remove large pre-installed toolchains not needed for Docker builds
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/man
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/puppeteer:latest
          # Cache layers in GitHub Actions cache (avoids Docker Hub 10GB blob limit)
          no-cache: true
