name: Build & Push RunPod Image

on:
  workflow_dispatch:  # manual trigger only — run when you want to publish a new image

jobs:
  build:
    runs-on: ubuntu-latest  # native linux/amd64, no emulation needed

    steps:
      - name: Free disk space
        # GitHub runners ship with ~14GB free. We need ~25GB for CUDA base + model + Chromium.
        # This removes pre-installed SDKs/tools that aren't needed for a Docker build.
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:latest
          # Cache layers between runs so model download is only paid once
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/avatar-worker:buildcache,mode=max
